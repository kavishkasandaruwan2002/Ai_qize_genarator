services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-study-assistant-server
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai-study-assistant-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
